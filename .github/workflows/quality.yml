name: Studio integration quality
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      STUDIO_TEST_VIDEO: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: PromptStudio_Video
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: tiko13/ComfyUI_PromptStudio
          path: ComfyUI_PromptStudio
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install isolated test dependencies
        run: |
          python -m pip install numpy Pillow av aiohttp
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          cd ComfyUI_PromptStudio
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Check both studios
        run: |
          cd PromptStudio_Video
          python -B -m unittest discover -s tests
          node --test tests/test_*.mjs
          cd ../ComfyUI_PromptStudio
          python -B -m unittest discover -s tests
          npm test
          npm run check:types
          npm run test:browser
          find web ../PromptStudio_Video/web -name '*.js' -exec node --check '{}' \;
          git diff-tree --check HEAD
          git -C ../PromptStudio_Video diff-tree --check HEAD
